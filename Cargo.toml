[package]
name = "radial-keys"
version = "0.1.0"
edition = "2024"
description = "A small D-Bus backend for radial keyboard menus"
license = "MIT"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"


[package]
name = "radial-keys"
version = "0.1.0"
edition = "2024"
description = "A D-Bus backend for a customizable radial action menu"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
evdev = { version = "0.13", features = ["tokio"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", features = ["tokio"] }
